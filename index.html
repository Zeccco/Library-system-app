<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MAC Library Library</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#243B2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE2;
    --card:#FCFAF3;
    --ink:#20261F;
    --ink-soft:#565B4E;
    --forest:#243B2C;
    --forest-2:#2F4B37;
    --brass:#9C7A28;
    --brass-light:#EADFAF;
    --line:#DCD5BE;
    --ok:#3E6B4B;
    --ok-bg:#E4EDE1;
    --warn:#A15A1E;
    --warn-bg:#F2E4CC;
    --bad:#9A3B2C;
    --bad-bg:#F3DFD6;
    --shadow: 0 1px 2px rgba(32,38,31,.06), 0 6px 18px rgba(32,38,31,.07);
    --radius: 10px;
    --topbar-h: 64px; /* fallback; measured precisely at runtime, see syncTopbarHeight() */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input, select, textarea{font-family:inherit;font-size:14px;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .shell{display:flex;flex:1;min-height:0;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--forest); color:#F4EFDD;
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:7px;background:var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--forest);flex-shrink:0;
  }
  .brand-text .t1{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.1;}
  .brand-text .t2{font-size:11px;color:#C9C2A2;letter-spacing:.02em;}
  .topbar .date{font-size:12px;color:#C9C2A2;display:none;}
  @media(min-width:640px){.topbar .date{display:block;}}

  nav.sidenav{
    width:212px;flex-shrink:0;background:var(--forest);color:#EDE7D2;
    padding:10px;display:none;flex-direction:column;gap:2px;
  }
  @media(min-width:860px){
    nav.sidenav{
      display:flex;
      /* Fixed in place while the main content scrolls, per the requested
         layout — sticky (not position:fixed) so it stays a normal flex
         item and doesn't need separate width/left bookkeeping. */
      position:sticky;
      top:var(--topbar-h);
      align-self:flex-start;
      height:calc(100vh - var(--topbar-h));
      overflow-y:auto;
    }
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:#D8D2BA; background:transparent;border:none;text-align:left;width:100%;font-size:14px;
  }
  .nav-item svg{flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--forest-2);color:#fff;}
  .nav-item.active{background:var(--brass);color:var(--forest);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-divider{height:1px;background:rgba(255,255,255,.12);margin:8px 6px;}

  main.view{flex:1;min-width:0;padding:18px 16px 92px;max-width:1180px;}
  @media(min-width:860px){main.view{padding:26px 30px 40px;}}

  /* Keeps the circulation quick-action row (Add Book, Issue Book, Return
     Book, View Fines, Holds) visible at the top of the content area while
     the rest of that page scrolls underneath it. */
  .sticky-toolbar{
    position:sticky;
    top:var(--topbar-h);
    z-index:15;
    background:var(--paper);
    padding-top:2px;
    padding-bottom:14px;
  }

  /* bottom mobile nav */
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--forest);display:flex;border-top:1px solid rgba(255,255,255,.1);
  }
  @media(min-width:860px){nav.bottomnav{display:none;}}
  .bnav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 2px 9px;background:none;border:none;color:#B9B295;font-size:10.5px;
  }
  .bnav-item.active{color:var(--brass-light);}
  .bnav-item svg{opacity:.9;}

  /* ---------- headers ---------- */
  .view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .view-head h1{font-size:24px;margin:0 0 4px;font-weight:600;}
  .view-head p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:52ch;}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-weight:500;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--brass);}
  .btn-primary{background:var(--forest);border-color:var(--forest);color:#F4EFDD;}
  .btn-primary:hover{background:var(--forest-2);}
  .btn-brass{background:var(--brass);border-color:var(--brass);color:var(--forest);font-weight:600;}
  .btn-danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
  .btn-ghost{background:transparent;border-color:transparent;padding:7px 9px;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  @keyframes btnspin{to{transform:rotate(360deg);}}
  .btn-spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:btnspin .6s linear infinite;vertical-align:-2px;margin-right:6px;}
  .btn[disabled] .btn-spinner{opacity:.9;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- cards / grid ---------- */
  .grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
  @media(min-width:640px){.grid-stats{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1000px){.grid-stats{grid-template-columns:repeat(6,1fr);}}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;box-shadow:var(--shadow);
  }
  button.stat-card{display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;}
  button.stat-card:hover{border-color:var(--brass);background:#F8F5EA;}
  .stat-card .num{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .stat-card.accent{border-color:var(--brass);}
  .stat-card.warn .num{color:var(--warn);}
  .stat-card.bad .num{color:var(--bad);}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:18px;}
  .panel h2{font-size:16px;margin:0 0 12px;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:960px){.two-col{grid-template-columns:1.3fr 1fr;}}

  .activity-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .activity-icon.issued{background:var(--ok-bg);color:var(--ok);}
  .activity-icon.returned{background:#E5E3F4;color:#4C4A8A;}
  .activity-icon.overdue{background:var(--bad-bg);color:var(--bad);}
  .activity-main{flex:1;min-width:0;}
  .activity-main .l1{font-weight:500;}
  .activity-main .l2{color:var(--ink-soft);font-size:12px;}
  .activity-when{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}

  /* ---------- toolbar / filters ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .search-box{
    position:relative;flex:1;min-width:190px;max-width:340px;
  }
  .search-box input{
    width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  }
  .search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.55;}
  select.filter-select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:12.5px;color:var(--ink-soft);
  }
  .chip.active{background:var(--forest);border-color:var(--forest);color:#F4EFDD;font-weight:600;}

  /* ---------- table ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
  thead th{
    text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.02em;color:var(--ink-soft);
    border-bottom:1px solid var(--line);background:#F7F3E6;white-space:nowrap;font-weight:600;
  }
  tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F8F5EA;}
  .cell-mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .cell-actions{display:flex;gap:4px;white-space:nowrap;}
  .icon-btn{
    width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-soft);
  }
  .icon-btn:hover{background:var(--brass-light);color:var(--forest);border-color:var(--line);}
  .icon-btn.danger:hover{background:var(--bad-bg);color:var(--bad);}
  .empty-row td{padding:34px 12px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}
  .badge.neutral{background:#EAE6D6;color:var(--ink-soft);}
  .badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(32,38,31,.5);display:flex;align-items:flex-end;justify-content:center;
    z-index:100; padding:0;
  }
  @media(min-width:640px){.overlay{align-items:center;padding:20px;}}
  .modal{
    background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;
    max-height:92vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25);
    animation: rise .18s ease-out;
  }
  @media(min-width:640px){.modal{border-radius:14px;animation:pop .16s ease-out;}}
  @keyframes rise{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  @keyframes pop{from{transform:scale(.97);opacity:.6;}to{transform:scale(1);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);}
  .modal-head h3{margin:0;font-size:17px;font-weight:600;}
  .modal-body{padding:16px 18px 20px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 18px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
  }
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .picker-list{margin-top:6px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);}
  .picker-row{display:block;width:100%;text-align:left;padding:9px 11px;border:none;border-bottom:1px solid var(--line);background:transparent;}
  .picker-row:last-child{border-bottom:none;}
  .picker-row:hover{background:#F8F5EA;}
  .picker-row.selected{background:var(--brass-light);}
  .picker-main{font-size:13px;font-weight:500;color:var(--ink);}
  .picker-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .picker-empty{padding:14px 11px;font-size:12.5px;color:var(--ink-soft);text-align:center;}

  .confirm-icon{width:42px;height:42px;border-radius:10px;background:var(--bad-bg);color:var(--bad);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .confirm-icon.neutral{background:var(--brass-light);color:var(--brass);}

  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--forest);color:#F4EFDD;
    padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);z-index:200;
  }
  @media(min-width:860px){.toast{bottom:22px;}}

  .fade-in{animation:fadein .25s ease-out;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}

  .subnote{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .print-title{margin-bottom:14px;}
  @media print{
    .topbar, .sidenav, .bottomnav, .no-print{display:none !important;}
    main.view{padding:0;}
    .print-title{display:block !important;}
    .table-wrap{box-shadow:none;border:1px solid #ccc;}
    body{background:#fff;}
  }

  /* ---------- barcodes / scanning ---------- */
  .barcode-svg{display:block;margin:8px auto;max-width:100%;}
  /* Fixed height + overflow:hidden guarantees a small, contained scanner box
     no matter what size video stream the camera actually provides — the
     video is forced to fill and crop to exactly this box, not the other
     way around, so it can never balloon out to fill the screen. */
  .scan-camera-wrap{
    width:100%;height:260px;max-width:360px;margin:0 auto;position:relative;overflow:hidden;border-radius:8px;
  }
  .scan-camera-box{
    width:100%;height:100%;background:#111;border-radius:8px;overflow:hidden;position:relative !important;
  }
  .scan-camera-box video, .scan-camera-box canvas{
    position:absolute !important;top:0;left:0;
    width:100% !important;height:100% !important;object-fit:cover;
  }
  .scan-camera-box canvas{display:none;} /* hide Quagga's internal debug/overlay canvas entirely */
  .scan-camera-guide{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:78%;height:34%;border:2px solid var(--brass);border-radius:6px;
    box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none;
  }
  /* Printing a single label: hide everything on the page except the label
     content, regardless of which page/modal happens to be open — a more
     targeted rule than the shelf-list print rule above, active only while
     body carries this class (set right before printing a label, cleared
     right after). */
  @media print{
    body.printing-label #app > *{visibility:hidden;}
    body.printing-label .print-label-content{
      visibility:visible !important;position:fixed;top:16px;left:16px;right:16px;
    }
    body.printing-label .print-label-content *{visibility:visible !important;}
  }

  /* ---------- auth ---------- */
  .auth-shell{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--paper);
  }
  .auth-card{
    width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:26px 24px 24px;
  }
  .auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;}
  .auth-brand .brand-mark{width:46px;height:46px;border-radius:11px;}
  .auth-brand h1{font-size:19px;margin:0;font-weight:600;text-align:center;}
  .auth-error{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;}
  .auth-notice{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;}
  .auth-foot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:14px;}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script>
/* ======================= Supabase connection =======================
   This app's data lives in the "Library system" Supabase project, in four
   tables: books, members, circulation, settings. The key below is the
   public "anon" key — safe to ship in client-side code by design, since
   access is governed by the project's Row Level Security policies rather
   than by keeping the key secret. Those policies currently allow full
   read/write to anyone holding this key (see the "anon full access" policy
   comment in the migration) — fine for a single-person setup, but anyone
   who gets this file gets equivalent access to the data until Auth is
   added and the policies are tightened. */
const SUPABASE_URL = 'https://wdnkbyerqbxzkbvbsfbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbmtieWVycWJ4emtidmJzZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Njc4MzQsImV4cCI6MjEwNTA0MzgzNH0.VGluwJfJfuAgl_LknWqxvxXKTEn9x9tmzRqWil66XQM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ======================= constants ======================= */
const DDC_MAIN_CLASSES = [
  {code:'000', name:'General Works'},
  {code:'100', name:'Philosophy & Psychology'},
  {code:'200', name:'Religion'},
  {code:'300', name:'Social Sciences'},
  {code:'400', name:'Language'},
  {code:'500', name:'Natural Sciences & Mathematics'},
  {code:'600', name:'Technology'},
  {code:'700', name:'Arts & Recreation'},
  {code:'800', name:'Literature'},
  {code:'900', name:'History & Geography'},
];
const MEMBER_CATEGORIES = ['Student','Teaching Staff','Non-Teaching Staff','Other'];
const MEMBER_STATUSES = ['Active','Suspended','Inactive'];
const ITEM_STATUSES = ['Available','Borrowed','Lost','Damaged','Missing','Withdrawn'];
// "Borrowed" is deliberately excluded from statuses choosable when adding a
// copy — that state must only ever be entered via Issue Book, which creates
// the matching circulation record. A copy born "Borrowed" with no loan
// behind it could never be returned through the normal flow.
const NEW_COPY_STATUSES = ITEM_STATUSES.filter(s=>s!=='Borrowed');
const MAX_BORROW_LIMIT = 2; // maximum books a member may have out at once
const MAX_BOOKS_PER_MEMBER = 2; // per spec: borrowing limit
const DEFAULT_SETTINGS = { loanPeriodDays:3, finePerDay:500, libraryName:'MZUNI Library' };
const MAX_RENEWALS = 2; // simple default cap on renewals per loan

/* ======================= state ======================= */
let lastRenderedRoute = null; // tracks route across renders so the view only fades in on an actual navigation
let cachedViewHtml = null;    // last-rendered page HTML, reused while a modal covers it (see render())
let cachedViewRoute = null;   // which route that cached HTML belongs to
let state = {
  loaded:false,
  loadError:false,
  session:null,          // Supabase auth session, or null if signed out
  authChecked:false,     // becomes true once we've checked for an existing session
  authError:'', authNotice:'', authBusy:false,
  books:[], members:[], circulation:[], holds:[], items:[], settings:{...DEFAULT_SETTINGS},
  route:'dashboard',
  modal:null,
  toast:null,
  catalogQuery:'', catalogAvail:'all', catalogDdc:'all', catalogShowWithdrawn:'false',
  memberQuery:'', memberStatus:'all',
  circQuery:'', circStatus:'all',
  finesFilter:'all',
  holdsFilter:'all',
};

/* ======================= auth ======================= */
async function loadLibraryName(){
  // Public, read-only: lets the sign-in screen show the real library name
  // even before anyone has logged in.
  try{
    const {data} = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(data) state.settings = settingsFromRow(data);
  } catch(e){ /* fall back to default name silently */ }
}
async function initAuth(){
  await loadLibraryName();
  const {data:{session}} = await sb.auth.getSession();
  state.session = session;
  state.authChecked = true;
  if(session) loadData(); else render();

  sb.auth.onAuthStateChange((event, newSession)=>{

    else if(!newSession){ state.loaded=false; state.books=[]; state.members=[]; state.circulation=[]; state.holds=[]; state.items=[]; render(); }
  });
}

/* ======================= data layer (Supabase) ======================= */
async function loadData(){
  try{
    const [booksRes, membersRes, circRes, holdsRes, itemsRes, settingsRes] = await Promise.all([
      sb.from('books').select('*').order('accession_no'),
      sb.from('members').select('*').order('member_id'),
      sb.from('circulation').select('*').order('transaction_id'),
      sb.from('holds').select('*').order('requested_date'),
      sb.from('items').select('*').order('item_no'),
      sb.from('settings').select('*').eq('id',1).maybeSingle(),
    ]);
    const firstError = booksRes.error || membersRes.error || circRes.error || holdsRes.error || itemsRes.error || settingsRes.error;
    if(firstError) throw firstError;
    state.books = (booksRes.data||[]).map(bookFromRow);
    state.members = (membersRes.data||[]).map(memberFromRow);
    state.circulation = (circRes.data||[]).map(circFromRow);
    state.holds = (holdsRes.data||[]).map(holdFromRow);
    state.items = (itemsRes.data||[]).map(itemFromRow);
    state.settings = settingsRes.data ? settingsFromRow(settingsRes.data) : {...DEFAULT_SETTINGS};
  } catch(e){
    console.error(e);
    state.loadError = true;
  }
  state.loaded = true;
  render();
}

// A simple, editable starting point for a call number: DDC + the first
// three letters of the author's surname (first word of the author field).
// Real Cutter numbers sometimes need a librarian's judgement call, so this
// is always shown as an editable suggestion, never locked in.
function suggestCallNumber(ddc, author){
  const surname = (author||'').trim().split(/\s+/)[0] || '';
  const code = surname.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase();
  return [ddc||'', code].filter(Boolean).join(' ');
}
function currentStaffEmail(){
  return (state.session && state.session.user && state.session.user.email) || '';
}
// The next library-wide accession number comes from a real database
// sequence (via the next_item_accession_no() function), not client-side
// math — that way two staff adding copies at the same moment, on different
// devices, can never collide or produce a gap.
async function nextItemAccessionNo(){
  const {data, error} = await sb.rpc('next_item_accession_no');
  if(error) return {error};
  return {accessionNo:data};
}
// Adds exactly ONE physical copy — the spec is explicit that there is no
// "quantity" field; every copy is its own deliberate action with its own
// accession number, checked for uniqueness before it's saved.
async function dbAddCopy({accessionNo, itemNoOverride, shelfLocation, status, acquiredDate}){
  const book = findBook(accessionNo);
  if(!book) return {error:{message:'Title not found.'}};
  let itemNo = (itemNoOverride||'').trim();
  if(itemNo){
    if(state.items.some(i=>i.itemNo===itemNo)){
      return {error:{message:'Accession number already exists. Please enter a unique accession number.'}};
    }
  } else {
    const {error:seqErr, accessionNo:generated} = await nextItemAccessionNo();
    if(seqErr) return {error:seqErr};
    itemNo = generated;
  }
  const copyNumber = itemsFor(accessionNo).length + 1;
  const row = {item_no:itemNo, accession_no:accessionNo, copy_number:copyNumber, status:status||'Available',
    shelf_location:shelfLocation||null, acquired_date:acquiredDate||todayISO()};
  const {error} = await sb.from('items').insert(row);
  if(error){
    if(error.code==='23505'){ return {error:{message:'Accession number already exists. Please enter a unique accession number.'}}; }
    return {error};
  }
  state.items.push(itemFromRow(row));
  book.totalCopies = (book.totalCopies||0) + 1;
  await sb.from('books').update({total_copies: book.totalCopies}).eq('accession_no', accessionNo);
  return {error:null, itemNo};
}
// Creates a brand-new title record, then its first physical copy — used
// when Add Book doesn't match any existing title.
async function dbInsertNewTitle(b, copyFields){
  const {error} = await sb.from('books').insert({
    accession_no:b.accessionNo, title:b.title, author:b.author, isbn:b.isbn||null,
    subject:b.subject||null, ddc:b.ddc, year:b.year||null, total_copies:0,
    call_number:b.callNumber||null, withdrawn_copies:0, status:'Active',
    edition:b.edition||null, publisher:b.publisher||null, department:b.department||null
  });
  if(error) return {error};
  state.books.push({...b, totalCopies:0, withdrawnCopies:0, status:'Active'});
  return await dbAddCopy({accessionNo:b.accessionNo, ...copyFields});
}

async function dbUpdateBook(accession, o){
  const existing = findBook(accession);
  const patch = {
    title:o.title.trim(), author:o.author.trim(), isbn:o.isbn.trim()||null, subject:o.subject.trim()||null,
    ddc:o.ddc.trim(), year:o.year?parseInt(o.year,10):null,
    call_number:(o.callNumber||'').trim()||null,
    edition:(o.edition||'').trim()||null, publisher:(o.publisher||'').trim()||null, department:(o.department||'').trim()||null
  };
  const {error} = await sb.from('books').update(patch).eq('accession_no', accession);
  if(error) return error;
  if(existing){
    existing.title=patch.title; existing.author=patch.author; existing.isbn=patch.isbn||''; existing.subject=patch.subject||'';
    existing.ddc=patch.ddc; existing.year=patch.year||''; existing.callNumber=patch.call_number||'';
    existing.edition=patch.edition||''; existing.publisher=patch.publisher||''; existing.department=patch.department||'';
  }
  return null;
}
// Withdraws one specific item — the lowest-numbered copy currently sitting
// Available — and returns its item number so the caller can show staff
// exactly which physical item left circulation.
async function dbWithdrawCopy(accession){
  const book = findBook(accession);
  if(!book) return {error:new Error('Book no longer exists.')};
  const item = nextAvailableItem(accession);
  if(!item) return {error:new Error('No available copy to withdraw.')};
  const {error} = await sb.from('items').update({status:'Withdrawn'}).eq('item_no', item.itemNo);
  if(error) return {error};
  item.status = 'Withdrawn';
  book.withdrawnCopies = (book.withdrawnCopies||0) + 1;
  await sb.from('books').update({withdrawn_copies: book.withdrawnCopies}).eq('accession_no', accession);
  return {error:null, itemNo:item.itemNo};
}

  return error;
}

async function dbInsertCirculation(c){

    transaction_id:c.transactionId, accession_no:c.accessionNo, member_id:c.memberId,
    issue_date:c.issueDate, due_date:c.dueDate, return_date:null,
    fine_per_day:c.finePerDay, fine_paid:false, item_no:c.itemNo, issued_by:currentStaffEmail()
  });
  if(error) return error;
  const itemErr = await dbSetItemStatus(c.itemNo, 'Borrowed');
  return itemErr || null;
}
async function dbApplyReturn(txnId, returnDate, condition){
  const c = state.circulation.find(x=>x.transactionId===txnId);
  if(!c) return new Error('Transaction no longer exists.');
  const patch = {return_date:returnDate, returned_by:currentStaffEmail(), return_condition:condition||'Good'};
  const {error} = await sb.from('circulation').update(patch).eq('transaction_id', txnId);
  if(error) return error;
  c.returnDate = returnDate; c.returnedBy = patch.returned_by; c.returnCondition = patch.return_condition;
  // The item goes back to Available — unless it came back Damaged or Lost,
  // in which case that one specific item is withdrawn for good. Either way
  // nothing about the title or its loan history is touched.
  const newItemStatus = (condition==='Damaged' || condition==='Lost') ? condition : 'Available';
  if(c.itemNo){
    const itemErr = await dbSetItemStatus(c.itemNo, newItemStatus);
    if(itemErr) return itemErr;
    if(newItemStatus!=='Available'){
      const book = findBook(c.accessionNo);
      if(book){
        book.withdrawnCopies = (book.withdrawnCopies||0) + 1;
        await sb.from('books').update({withdrawn_copies: book.withdrawnCopies}).eq('accession_no', c.accessionNo);
      }
    }
  }
  return null;
}
async function dbRenewLoan(txnId, newDueDate){
  const c = state.circulation.find(x=>x.transactionId===txnId);
  if(!c) return new Error('Transaction no longer exists.');
  const {error} = await sb.from('circulation').update({due_date:newDueDate, renewal_count:c.renewalCount+1}).eq('transaction_id', txnId);
  if(!error){ c.dueDate = newDueDate; c.renewalCount += 1; }
  return error;
}

/* ======================= backup: export / import ======================= */
function bookToRow(b){
  return {accession_no:b.accessionNo, title:b.title, author:b.author, isbn:b.isbn||null, subject:b.subject||null,
    ddc:b.ddc, year:b.year||null, total_copies:b.totalCopies, call_number:b.callNumber||null,
    withdrawn_copies:b.withdrawnCopies||0, status:b.status||'Active',
    edition:b.edition||null, publisher:b.publisher||null, department:b.department||null};
}
function memberToRow(m){
  return {member_id:m.memberId, name:m.name, category:m.category, phone:m.phone||null, status:m.status};
}
function circToRow(c){
  return {transaction_id:c.transactionId, accession_no:c.accessionNo, member_id:c.memberId, issue_date:c.issueDate,
    due_date:c.dueDate, return_date:c.returnDate, fine_per_day:c.finePerDay, fine_paid:c.finePaid, item_no:c.itemNo,
    renewal_count:c.renewalCount||0, issued_by:c.issuedBy||null, returned_by:c.returnedBy||null, return_condition:c.returnCondition||null};
}
function itemToRow(i){
  return {item_no:i.itemNo, accession_no:i.accessionNo, copy_number:i.copyNumber, status:i.status, acquired_date:i.acquiredDate, shelf_location:i.shelfLocation||null};
}
function holdToRow(h){
  return {hold_id:h.holdId, accession_no:h.accessionNo, member_id:h.memberId, requested_date:h.requestedDate, status:h.status};
}
function handleExportData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    libraryName: state.settings.libraryName,
    books: state.books.map(bookToRow),
    members: state.members.map(memberToRow),
    items: state.items.map(itemToRow),
    circulation: state.circulation.map(circToRow),
    holds: state.holds.map(holdToRow),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `library-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup file downloaded.');
}
// Import is additive-only, by design: it inserts records whose primary key
// isn't already present, and never touches or overwrites anything that's
// already here — consistent with never deleting/overwriting data silently.
async function handleImportFile(file){
  let payload;
  try{
    payload = JSON.parse(await file.text());
  } catch(e){
    showToast('That file could not be read as a backup — invalid JSON.');
    return;
  }
  const existingBooks = new Set(state.books.map(b=>b.accessionNo));
  const existingMembers = new Set(state.members.map(m=>m.memberId));
  const existingItems = new Set(state.items.map(i=>i.itemNo));
  const existingCirc = new Set(state.circulation.map(c=>c.transactionId));
  const existingHolds = new Set(state.holds.map(h=>h.holdId));

  const newBooks = (payload.books||[]).filter(r=>!existingBooks.has(r.accession_no));
  const newMembers = (payload.members||[]).filter(r=>!existingMembers.has(r.member_id));
  const newItems = (payload.items||[]).filter(r=>!existingItems.has(r.item_no));
  const newCirc = (payload.circulation||[]).filter(r=>!existingCirc.has(r.transaction_id));
  const newHolds = (payload.holds||[]).filter(r=>!existingHolds.has(r.hold_id));

  let inserted = 0, failedGroups = 0;
  // Order matters: books/members before items, and all of those before
  // circulation/holds, since those reference the others by foreign key.
  for(const [rows, table] of [[newBooks,'books'],[newMembers,'members'],[newItems,'items'],[newCirc,'circulation'],[newHolds,'holds']]){
    if(!rows.length) continue;
    const {error} = await sb.from(table).insert(rows);
    if(error){ failedGroups++; console.error(table, error); } else { inserted += rows.length; }
  }
  await loadData();
  closeModal();
  showToast(failedGroups
    ? `Imported ${inserted} record(s) — ${failedGroups} group(s) failed, see console for details.`
    : (inserted ? `Imported ${inserted} new record(s). Existing records were left untouched.` : 'Nothing new to import — every record in that file already exists here.'));
}

/* ======================= helpers ======================= */
// Formats a Date as YYYY-MM-DD using its LOCAL date fields — not
// toISOString(), which converts to UTC and can land on the wrong calendar
// day (e.g. showing yesterday's date for part of the evening in timezones
// ahead of UTC, like Malawi's).
function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toLocalISODate(new Date()); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toLocalISODate(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nextId(prefix, list, field){
  let max = 0;
  list.forEach(item=>{
    const m = String(item[field]||'').match(/(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix + String(max+1).padStart(3,'0');
}
function findBook(acc){ return state.books.find(b=>b.accessionNo===acc); }
function findMember(id){ return state.members.find(m=>m.memberId===id); }
function findItem(itemNo){ return state.items.find(i=>i.itemNo===itemNo); }
function itemsFor(accessionNo){ return state.items.filter(i=>i.accessionNo===accessionNo); }
function borrowedCountFor(acc){
  return state.circulation.filter(c=>c.accessionNo===acc && !c.returnDate).length;
}
// How many books this member currently has out — returned loans don't count.
function activeLoanCountFor(memberId){
  return state.circulation.filter(c=>c.memberId===memberId && !c.returnDate).length;
}
// Copies still in the collection — every item that hasn't been withdrawn,
// lost, or reported damaged. Each one is a real, individually-numbered row
// in the items table, not just a count.
function activeCopies(book){
  return itemsFor(book.accessionNo).filter(i=>i.status!=='Withdrawn' && i.status!=='Lost' && i.status!=='Damaged' && i.status!=='Missing').length;
}
function availableCopies(book){
  return itemsFor(book.accessionNo).filter(i=>i.status==='Available').length;
}
// The specific item that will be handed out next — lowest item number
// currently sitting Available for this title.
function nextAvailableItem(accessionNo){
  const avail = itemsFor(accessionNo).filter(i=>i.status==='Available');
  avail.sort((a,b)=>a.itemNo.localeCompare(b.itemNo));
  return avail[0] || null;
}
function holdsWaitingCount(accessionNo){
  return state.holds.filter(h=>h.accessionNo===accessionNo && h.status==='Waiting').length;
}
function isOverdue(c){
  return !c.returnDate && c.dueDate && c.dueDate < todayISO();
}
function isDueSoon(c){
  if(c.returnDate || !c.dueDate) return false;
  const d = daysBetween(todayISO(), c.dueDate);
  return d >= 0 && d <= 7;
}
function txnStatus(c){
  if(c.returnDate) return 'Returned';
  if(isOverdue(c)) return 'Overdue';
  return 'Borrowed';
}
function daysLate(c){
  const end = c.returnDate || (isOverdue(c) ? todayISO() : null);
  if(!end || !c.dueDate) return 0;
  return Math.max(0, daysBetween(c.dueDate, end));
}
function fineFor(c){
  const dl = daysLate(c);
  if(dl<=0) return 0;
  return dl * (c.finePerDay || state.settings.finePerDay);
}
function ddcMainCode(ddc){
  const n = parseFloat(ddc);
  if(isNaN(n)) return null;
  return String(Math.floor(n/100)*100).padStart(3,'0');
}
function ddcMainName(ddc){
  const code = ddcMainCode(ddc);
  const found = DDC_MAIN_CLASSES.find(d=>d.code===code);
  return found ? found.name : 'Unclassified';
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ if(state.toast===msg){ state.toast=null; render(); } }, 2600);
}
function closeModal(){
  if(state.modal && state.modal.type==='cameraScan'){
    stopCameraScan();
    state.modal = state.modal.previousModal || null;
  } else {
    state.modal = null;
  }
  render();
}

// Replaces just one element's outer HTML (used for the results tables,
// whose generator functions return the wrapping div, id included) or just
// its inner HTML (used for picker lists, whose generators return only the
// row fragments) — either way, nothing outside that one element is touched,
// so focus/keyboard/scroll position everywhere else on the page is
// completely undisturbed.
function swapOuter(id, html){ const el = document.getElementById(id); if(el) el.outerHTML = html; }
// Measures the topbar's real rendered height and stores it as --topbar-h,
// so the sticky sidebar and sticky action toolbars line up under it
// exactly — rather than guessing a fixed pixel value that could leave a
// gap or overlap if the topbar's height ever varies slightly.
function syncTopbarHeight(){
  const el = document.querySelector('.topbar');
  if(el) document.documentElement.style.setProperty('--topbar-h', el.offsetHeight+'px');
}
function swapInner(id, html){ const el = document.getElementById(id); if(el) el.innerHTML = html; }
// Instant feedback the moment a button is clicked, before its network
// request even starts — so a save never *looks* like it did nothing while
// waiting on Supabase. No matching "un-busy" call is needed: every action
// this is used for ends in a render() (closing the modal on success, or
// regenerating it fresh from its template on error), which naturally
// replaces this button with a normal one either way.
function setButtonBusy(btn, label){
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = `<span class="btn-spinner"></span>${esc(label||'Working…')}`;
}

/* ======================= barcodes ======================= */
// Draws every pending barcode placeholder left in the DOM by the last
// render() — called once at the end of render() itself. Cheap no-op when
// there are none. JsBarcode is loaded from a CDN; if that failed to load
// (e.g. genuinely offline on the very first-ever visit, before anything
// has been cached) the placeholders are simply left as empty boxes rather
// than throwing.
function drawPendingBarcodes(){
  if(typeof JsBarcode==='undefined') return;
  document.querySelectorAll('.barcode-svg[data-code]').forEach(el=>{
    const code = el.dataset.code;
    if(!code || el.dataset.drawn===code) return;
    try{
      JsBarcode(el, code, {format:'CODE128', displayValue:true, fontSize:14, height:46, margin:6});
      el.dataset.drawn = code;
    } catch(e){ /* leave the placeholder blank rather than crash the render */ }
  });
}

/* ======================= barcode scanning ======================= */
// One entry point for every scan source — a USB/Bluetooth "keyboard
// wedge" scanner, the camera scanner, or the manual search boxes that
// remain the backup for all of this. Whatever context is open when a
// code comes in decides what happens with it.
function handleScannedCode(code){
  code = (code||'').trim();
  if(!code) return;
  const item = findItem(code);
  if(!item){ showToast(`No item found with accession number ${code}.`); return; }
  const modal = state.modal;
  if(modal && modal.type==='issueBook'){
    if(item.status!=='Available'){ showToast(`This copy (${item.itemNo}) is currently ${item.status} and cannot be checked out.`); return; }
    const book = findBook(item.accessionNo);
    modal.selectedAccession = item.accessionNo;
    modal.selectedItemNo = item.itemNo;
    modal.lockToItem = true;
    modal.bookQuery = (book?book.title:item.accessionNo) + ' — ' + item.itemNo;
    render();
    return;
  }
  if(modal && modal.type==='returnBookPicker'){
    const loan = state.circulation.find(c=>c.itemNo===item.itemNo && !c.returnDate);
    if(!loan){ showToast(`Accession ${item.itemNo} is not currently checked out.`); return; }
    modal.selectedTxn = loan.transactionId;
    render();
    return;
  }
  // Scanning from the Catalog or Circulation page's own search box (no
  // modal open) — just drop the code straight into that page's search,
  // exactly as if it had been typed, and let its existing search/filtering
  // do the rest.
  if(!modal && state.route==='catalog'){
    state.catalogQuery = code;
    render();
    return;
  }
  if(!modal && state.route==='circulation'){
    state.circQuery = code;
    render();
    return;
  }
  // No issue/return context open — fall back to a standalone lookup so
  // scanning always does *something* useful: shows the exact copy and its
  // current status, per spec, with a contextual next action offered.
  state.modal = {type:'scanResult', itemNo:item.itemNo};
  render();
}

// USB/Bluetooth barcode scanners act as an ordinary keyboard, typing the
// code very fast and ending with Enter/Tab. This distinguishes that from
// normal human typing by speed, and only when focus isn't already on a
// text field (those already have their own search-and-select behavior,
// including exact accession-number matches, so a scan while typing there
// works naturally without any of this).
let usbScanBuffer = '';
let usbScanStartTime = 0;
document.addEventListener('keydown', (e)=>{
  const active = document.activeElement;
  const isEditable = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT');
  if(isEditable) return;
  const now = Date.now();
  if(e.key==='Enter' || e.key==='Tab'){
    const elapsed = now - usbScanStartTime;
    const code = usbScanBuffer;
    usbScanBuffer = '';
    if(code.length>=3 && elapsed>0 && (elapsed/code.length)<80){
      e.preventDefault();
      handleScannedCode(code);
    }
    return;
  }
  if(/^[A-Za-z0-9]$/.test(e.key)){
    if(now - usbScanStartTime > 300) usbScanBuffer = '';
    if(usbScanBuffer==='') usbScanStartTime = now;
    usbScanBuffer += e.key;
    if(usbScanBuffer.length>40) usbScanBuffer = usbScanBuffer.slice(-40);
  }
});

// Camera scanning (Quagga2) — opened over whichever modal was already up
// (Issue or Return), and restores that modal with the result applied once
// a code is found, cancelled, or errors out.
let quaggaRunning = false;
function openCameraScan(context){
  state.modal = {type:'cameraScan', context, previousModal: state.modal};
  render();
}
function startCameraScanIfNeeded(){
  if(!state.modal || state.modal.type!=='cameraScan' || quaggaRunning) return;
  if(typeof Quagga==='undefined'){ showToast('Camera scanning library failed to load — check your connection and try again.'); closeModal(); return; }
  const target = document.getElementById('scanCameraTarget');
  if(!target) return;
  Quagga.init({
    inputStream:{
      name:'Live', type:'LiveStream', target,
      constraints:{ facingMode:'environment', width:{ideal:480}, height:{ideal:320} }
    },
    decoder:{ readers:['code_128_reader'] },
    locate:false, // no debug overlay canvas — keeps the box small and simple
    numOfWorkers: 2
  }, function(err){
    if(err){ showToast('Could not access the camera: '+(err.message||err)); closeModal(); return; }
    Quagga.start();
    quaggaRunning = true;
  });
  Quagga.onDetected(onBarcodeDetected);
}
function stopCameraScan(){
  if(!quaggaRunning) return;
  try{ Quagga.offDetected(onBarcodeDetected); Quagga.stop(); } catch(e){ /* already stopped */ }
  quaggaRunning = false;
}
function onBarcodeDetected(result){
  const code = result && result.codeResult && result.codeResult.code;
  stopCameraScan();
  state.modal = state.modal.previousModal || null;
  if(code) handleScannedCode(code);
  else render();
}

/* ======================= render root ======================= */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && 'selectionStart' in active) ? active.selectionStart : null;
  const selEnd = (active && 'selectionStart' in active) ? active.selectionEnd : null;
  const scrollY = window.scrollY;

  const app = document.getElementById('app');
  if(!state.authChecked){
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;">Loading…</div>`;
    return;
  }
  if(!state.session){
    app.innerHTML = renderAuthScreen();
    attachAuthHandlers();
    return;
  }
  if(!state.loaded){
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;">Loading library data…</div>`;
    return;
  }
  if(state.loadError){
    app.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center;color:var(--ink-soft);font-family:'IBM Plex Sans',sans-serif;">
      <div style="font-family:'Fraunces',serif;font-size:19px;color:var(--ink);">Couldn't reach the library database</div>
      <div style="max-width:44ch;font-size:13.5px;">Check your internet connection, then reload. If this keeps happening, the Supabase project may be paused or its keys may have changed.</div>
      <button class="btn btn-primary" onclick="location.reload()" style="margin-top:6px;">Retry</button>
    </div>`;
    return;
  }
  // Only replay the view's fade-in when the route actually changes — not on
  // every render (a keystroke, a toast, a modal open) — otherwise the whole
  // page visibly flashes on every letter typed into a search box.
  const routeChanged = state.route !== lastRenderedRoute;
  lastRenderedRoute = state.route;

  // While a modal is open, the page behind it is fully hidden by the overlay
  // — so there's no need to re-filter/re-sort/re-render the whole Catalog,
  // Circulation, etc. table just because something changed *inside* the
  // modal. Reuse the last computed page HTML in that case; only recompute
  // it when the modal isn't open, or the route changed underneath it. This
  // is what makes picking a book/member, or any other in-modal action,
  // respond instantly instead of redoing a full page's worth of work first.
  let viewHtml;
  if(state.modal && cachedViewRoute===state.route && cachedViewHtml!==null){
    viewHtml = cachedViewHtml;
  } else {
    viewHtml = renderView();
    cachedViewHtml = viewHtml;
    cachedViewRoute = state.route;
  }

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">${icon('book',19)}</div>
        <div class="brand-text">
          <div class="t1">${esc(state.settings.libraryName)}</div>
          <div class="t2">Control Center</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="date">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        <button class="icon-btn" data-open-modal="backup" title="Backup / restore data" style="color:#F4EFDD;">${icon('download',16)}</button>
        <button class="btn btn-sm" data-action="signOut" title="Sign out" style="background:transparent;border-color:rgba(244,239,221,.35);color:#F4EFDD;">${icon('x',14)} Sign out</button>
      </div>
    </div>
    <div class="shell">
      ${renderSidenav()}
      <main class="view ${routeChanged ? 'fade-in' : ''}">${viewHtml}</main>
    </div>
    ${renderBottomnav()}
    ${state.modal ? renderModal() : ''}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    } else {
      window.scrollTo(0, scrollY);
    }
  }
  attachHandlers();
  // Safety net: if the camera modal isn't the one showing anymore for any
  // reason, make sure the camera stream actually gets released.
  if(quaggaRunning && (!state.modal || state.modal.type!=='cameraScan')) stopCameraScan();
  startCameraScanIfNeeded();
  drawPendingBarcodes();
}

    </div>
    ${state.authError ? `<div class="auth-error">${esc(state.authError)}</div>` : ''}
    ${state.authNotice ? `<div class="auth-notice">${esc(state.authNotice)}</div>` : ''}
    <div id="authForm">
      <div class="field"><label>Email</label><input type="email" name="email" id="authEmail" autocomplete="username" required></div>

function attachAuthHandlers(){
  const app = document.getElementById('app');
  app.onclick = (e)=>{
    const action = e.target.closest('[data-action]');
    if(!action) return;
    const email = (document.getElementById('authEmail')||{}).value || '';
    const password = (document.getElementById('authPassword')||{}).value || '';
    if(action.dataset.action==='doSignIn'){
      if(!email.trim() || !password){ state.authError='Enter your email and password.'; render(); return; }
      handleSignIn(email.trim(), password);
    }
  };
  app.onkeydown = (e)=>{
    if(e.key!=='Enter') return;
    const btn = document.querySelector('.auth-card [data-action]');
    if(btn){ e.preventDefault(); btn.click(); }
  };
}

// Filters + builds just the results table. Pulled out on its own so a
// keystroke in the search box can swap only this piece back in — the
// topbar/sidebar/toolbar around it never get torn down and rebuilt.
// One row per PHYSICAL COPY, not per title — searching for a specific
// accession number returns that exact book, and a title with several
// copies shows each one separately with its own status, per spec.
function catalogTableHtml(){
  const q = state.catalogQuery.trim().toLowerCase();
  const showWithdrawnTitles = state.catalogShowWithdrawn==='true';

  let items = state.items.slice();
  if(!showWithdrawnTitles){
    items = items.filter(it=>{ const b=findBook(it.accessionNo); return !b || b.status!=='Withdrawn'; });
  }
  if(q){
    items = items.filter(it=>{
      const b = findBook(it.accessionNo);
      const haystack = [it.itemNo, b?b.title:'', b?b.author:'', b?b.subject:'', b?b.ddc:'', b?b.isbn:'', b?b.callNumber:''].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  if(state.catalogAvail==='available') items = items.filter(it=>it.status==='Available');
  if(state.catalogAvail==='unavailable') items = items.filter(it=>it.status!=='Available');
  if(state.catalogDdc!=='all') items = items.filter(it=>{ const b=findBook(it.accessionNo); return b && ddcMainCode(b.ddc)===state.catalogDdc; });

  items.sort((a,b)=> a.accessionNo===b.accessionNo ? a.copyNumber-b.copyNumber : a.accessionNo.localeCompare(b.accessionNo));

  return `
    <div class="table-wrap" id="catalogTableWrap"><table>
      <thead><tr>
        <th>Accession No.</th><th>Title</th><th>Author</th><th>Call No.</th><th>Subject</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${items.length ? items.map(it=>{
          const book = findBook(it.accessionNo);
          const withdrawnTitle = book && book.status==='Withdrawn';
          const waiting = book ? holdsWaitingCount(book.accessionNo) : 0;
          const statusBadge = it.status==='Available' ? 'ok' : (it.status==='Borrowed' ? 'warn' : 'bad');
          const loan = it.status==='Borrowed' ? state.circulation.find(c=>c.itemNo===it.itemNo && !c.returnDate) : null;
          const member = loan ? findMember(loan.memberId) : null;
          return `<tr${withdrawnTitle?' style="opacity:.55;"':''}>
            <td class="cell-mono">${esc(it.itemNo)}</td>
            <td>${esc(book?book.title:'(unknown title)')}${waiting?` <span class="badge neutral" title="${waiting} member(s) waiting">${icon('clock',11)} ${waiting}</span>`:''}${withdrawnTitle?` <span class="badge bad">Title withdrawn</span>`:''}</td>
            <td>${esc(book?book.author:'')}</td>
            <td class="cell-mono">${esc(book?book.callNumber:'—')}</td>
            <td>${esc(book?book.subject:'')}</td>
            <td><span class="badge ${statusBadge}"><span class="badge-dot"></span>${esc(it.status)}</span>${member?`<div class="subnote">with ${esc(member.name)}</div>`:''}</td>
            <td><div class="cell-actions">
              <button class="icon-btn" title="View title record" data-open-modal="viewItems" data-accession="${esc(it.accessionNo)}">${icon('tag',15)}</button>
              ${!withdrawnTitle && it.status==='Available' ? `<button class="icon-btn" title="Issue this copy" data-open-modal="issueBook" data-accession="${esc(it.accessionNo)}" data-item="${esc(it.itemNo)}">${icon('swap',15)}</button>` : ''}
              ${!withdrawnTitle ? `<button class="icon-btn" title="Edit title" data-open-modal="editBook" data-accession="${esc(it.accessionNo)}">${icon('pencil',15)}</button>` : ''}
            </div></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="7">No copies match your filters.</td></tr>`}
      </tbody>
    </table></div>
  `;
}
function chip(stateKey, value, label){
  const active = state[stateKey]===value;
  return `<button class="chip ${active?'active':''}" data-chip="${stateKey}" data-value="${value}">${esc(label)}</button>`;
}

/* ======================= MEMBERS ======================= */
function renderMembers(){
  return `

      <div class="search-box">${icon('search',16)}<input id="memberSearch" data-input="memberQuery" placeholder="Search member ID, name, phone…" value="${esc(state.memberQuery)}"></div>
      <select class="filter-select" data-select="memberStatus">
        <option value="all" ${state.memberStatus==='all'?'selected':''}>All statuses</option>

    ${memberTableHtml()}

}
function memberTableHtml(){
  let rows = state.members.slice();
  const q = state.memberQuery.trim().toLowerCase();
  if(q) rows = rows.filter(m=>[m.memberId,m.name,m.phone,m.category].join(' ').toLowerCase().includes(q));
  if(state.memberStatus!=='all') rows = rows.filter(m=>m.status===state.memberStatus);

  return `
    <div class="table-wrap" id="memberTableWrap"><table>
      <thead><tr><th>Member ID</th><th>Name</th><th>Category</th><th>Phone</th><th>Status</th><th>Active loans</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(m=>{
          const activeLoans = state.circulation.filter(c=>c.memberId===m.memberId && !c.returnDate).length;
          const badgeCls = m.status==='Active' ? 'ok' : (m.status==='Suspended' ? 'bad' : 'neutral');
          return `<tr>
            <td class="cell-mono">${esc(m.memberId)}</td>
            <td>${esc(m.name)}</td>
            <td>${esc(m.category)}</td>
            <td class="cell-mono">${esc(m.phone)}</td>
            <td><span class="badge ${badgeCls}"><span class="badge-dot"></span>${esc(m.status)}</span></td>

              <button class="icon-btn" title="Edit" data-open-modal="editMember" data-member="${esc(m.memberId)}">${icon('pencil',15)}</button>
              <button class="icon-btn danger" title="Delete" data-action="deleteMember" data-member="${esc(m.memberId)}">${icon('trash',15)}</button>
            </div></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="7">No members match your filters.</td></tr>`}
      </tbody>
    </table></div>

}

/* ======================= CIRCULATION ======================= */
function renderCirculation(){
  return `
    <div class="view-head">
      <div><h1>Circulation</h1><p>Issue and return books, track due dates automatically.</p></div>
      <div class="btn-row sticky-toolbar">
        <button class="btn btn-brass" data-open-modal="issueBook">${icon('swap',15)} Issue Book</button>
        <button class="btn" data-open-modal="returnBookPicker">${icon('check',15)} Return Book</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">${icon('search',16)}<input id="circSearch" data-input="circQuery" placeholder="Search accession no. (e.g. LIB0003), transaction, member, title…" value="${esc(state.circQuery)}"></div>
      <button type="button" class="icon-btn" title="Scan barcode with camera" data-action="openCameraScan" data-context="circulation" style="border:1px solid var(--line);flex-shrink:0;">${icon('camera',16)}</button>
    </div>
    <div class="chip-row" style="margin-bottom:14px;">
      ${chip('circStatus','all','All')}
      ${chip('circStatus','borrowed','Borrowed')}
      ${chip('circStatus','overdue','Overdue')}
      ${chip('circStatus','duesoon','Due in 7 days')}
      ${chip('circStatus','returned','Returned')}
    </div>

    ${circTableHtml()}
  `;
}
function circTableHtml(){
  let rows = state.circulation.slice();
  const q = state.circQuery.trim().toLowerCase();
  if(q){
    rows = rows.filter(c=>{
      const book = findBook(c.accessionNo); const member = findMember(c.memberId);
      return [c.transactionId,c.itemNo,c.accessionNo,c.memberId,book?book.title:'',member?member.name:''].join(' ').toLowerCase().includes(q);
    });
  }
  if(state.circStatus==='borrowed') rows = rows.filter(c=>!c.returnDate && !isOverdue(c));
  if(state.circStatus==='overdue') rows = rows.filter(isOverdue);
  if(state.circStatus==='duesoon') rows = rows.filter(isDueSoon);
  if(state.circStatus==='returned') rows = rows.filter(c=>c.returnDate);

  rows.sort((a,b)=> (b.issueDate||'').localeCompare(a.issueDate||''));

  return `
    <div class="table-wrap" id="circTableWrap"><table>
      <thead><tr><th>Txn</th><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Status</th><th>Fine</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(c=>{
          const book = findBook(c.accessionNo); const member = findMember(c.memberId);
          const status = txnStatus(c);
          const badgeCls = status==='Overdue'?'bad':(status==='Returned'?'neutral':'ok');
          const fine = fineFor(c);
          return `<tr>
            <td class="cell-mono">${esc(c.transactionId)}${c.itemNo?`<div class="subnote">item ${c.itemNo}</div>`:''}</td>
            <td>${esc(book?book.title:c.accessionNo)}<div class="subnote mono">${esc(c.accessionNo)}</div></td>
            <td>${esc(member?member.name:c.memberId)}<div class="subnote mono">${esc(c.memberId)}</div></td>
            <td>${fmtDate(c.issueDate)}${c.issuedBy?`<div class="subnote">by ${esc(c.issuedBy)}</div>`:''}</td>
            <td>${fmtDate(c.dueDate)}${c.renewalCount?`<div class="subnote">renewed ${c.renewalCount}×</div>`:''}</td>
            <td>${fmtDate(c.returnDate)}${c.returnCondition && c.returnCondition!=='Good'?`<div class="subnote">${esc(c.returnCondition)}</div>`:''}</td>
            <td><span class="badge ${badgeCls}"><span class="badge-dot"></span>${status}</span></td>
            <td>${fine ? 'MK '+fine.toLocaleString() : '—'}</td>
            <td><div class="cell-actions">
              ${!c.returnDate ? `<button class="icon-btn" title="Return" data-open-modal="returnBook" data-txn="${esc(c.transactionId)}">${icon('check',15)}</button>` : ''}
              ${!c.returnDate ? `<button class="icon-btn" title="Renew" data-action="renewLoan" data-txn="${esc(c.transactionId)}">${icon('clock',15)}</button>` : ''}
              <button class="icon-btn danger" title="Delete" data-action="deleteCirc" data-txn="${esc(c.transactionId)}">${icon('trash',15)}</button>
            </div></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="9">No transactions match your filters.</td></tr>`}
      </tbody>
    </table></div>
  `;
}

/* ======================= FINES ======================= */
function renderFines(){
  let rows = state.circulation.filter(c=>fineFor(c)>0);
  if(state.finesFilter==='outstanding') rows = rows.filter(c=>!c.finePaid);
  if(state.finesFilter==='paid') rows = rows.filter(c=>c.finePaid);
  rows.sort((a,b)=> fineFor(b)-fineFor(a));

  const outstanding = state.circulation.reduce((s,c)=> s+(c.finePaid?0:fineFor(c)),0);
  const collected = state.circulation.reduce((s,c)=> s+(c.finePaid?fineFor(c):0),0);

  return `
    <div class="view-head">
      <div><h1>Fines</h1><p>Automatically calculated from days overdue × fine per day.</p></div>
    </div>

    <div class="grid-stats" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat-card warn"><div class="num">MK ${outstanding.toLocaleString()}</div><div class="lbl">Outstanding</div></div>
      <div class="stat-card"><div class="num">MK ${collected.toLocaleString()}</div><div class="lbl">Collected</div></div>
    </div>

    <div class="chip-row" style="margin-bottom:14px;">
      ${chip('finesFilter','all','All fines')}
      ${chip('finesFilter','outstanding','Outstanding')}
      ${chip('finesFilter','paid','Paid')}
    </div>

    <div class="table-wrap"><table>
      <thead><tr><th>Txn</th><th>Member</th><th>Book</th><th>Due</th><th>Returned</th><th>Days late</th><th>MK/day</th><th>Total fine</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(c=>{
          const book = findBook(c.accessionNo); const member = findMember(c.memberId);
          return `<tr>
            <td class="cell-mono">${esc(c.transactionId)}</td>
            <td>${esc(member?member.name:c.memberId)}</td>
            <td>${esc(book?book.title:c.accessionNo)}</td>
            <td>${fmtDate(c.dueDate)}</td>
            <td>${c.returnDate ? fmtDate(c.returnDate) : `<span class="badge bad">Still out</span>`}</td>
            <td>${daysLate(c)}</td>
            <td>${c.finePerDay || state.settings.finePerDay}</td>
            <td style="font-weight:600;">MK ${fineFor(c).toLocaleString()}</td>
            <td>
              ${c.finePaid
                ? `<button class="btn btn-sm" data-action="unmarkPaid" data-txn="${esc(c.transactionId)}">Mark unpaid</button>`
                : `<button class="btn btn-sm btn-brass" data-action="markPaid" data-txn="${esc(c.transactionId)}">Mark paid</button>`}
            </td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="9">No fines to show.</td></tr>`}
      </tbody>
    </table></div>
  `;
}

      <thead><tr><th>Hold ID</th><th>Book</th><th>Member</th><th>Requested</th><th>Status</th><th></th></tr></thead>

        ${rows.length ? rows.map(h=>{

  const rows = state.books.slice().sort((a,b)=>{
    const ca = a.callNumber || a.ddc || '';
    const cb = b.callNumber || b.ddc || '';
    return ca.localeCompare(cb) || a.title.localeCompare(b.title);
  });
  return `
    <div class="view-head no-print">
      <div><h1>Shelf list</h1><p>Sorted by call number — for verifying what's actually on the shelf.</p></div>
      <div class="btn-row">
        <button class="btn" data-nav="catalog">${icon('x',15)} Back to Catalog</button>

      </div>
    </div>
    <div class="print-title" style="display:none;">
      <h1 class="serif">${esc(state.settings.libraryName)} — Shelf List</h1>
      <div class="subnote">Printed ${fmtDate(todayISO())}</div>
    </div>

      <thead><tr><th>Call No.</th><th>Accession</th><th>Title</th><th>Author</th><th>Active copies</th><th>Status</th></tr></thead>

            <td>${esc(b.title)}</td>

/* ======================= MODALS ======================= */
function renderModal(){
  const m = state.modal;
  let inner = '';
  if(m.type==='addBook') inner = addCopyModal(m);
  else if(m.type==='editBook') inner = editBookModal(findBook(m.accession));
  else if(m.type==='addMember') inner = memberFormModal(null);
  else if(m.type==='editMember') inner = memberFormModal(findMember(m.member));
  else if(m.type==='issueBook') inner = issueFormModal(m);
  else if(m.type==='returnBookPicker') inner = returnPickerModal(m);
  else if(m.type==='returnBook') inner = returnFormModal(m.txn);
  else if(m.type==='withdrawBook') inner = withdrawBookModal(m.accession);
  else if(m.type==='viewItems') inner = viewItemsModal(m.accession);
  else if(m.type==='placeHold') inner = placeHoldModal(m);
  else if(m.type==='backup') inner = backupModal();
  else if(m.type==='cameraScan') inner = cameraScanModal(m);
  else if(m.type==='scanResult') inner = scanResultModal(m.itemNo);
  else if(m.type==='printLabel') inner = printLabelModal(m.itemNo);
  else if(m.type==='confirm') inner = confirmModal(m);
  return `<div class="overlay" id="overlay">${inner}</div>`;
}

function cameraScanModal(modal){
  return modalShell('Scan a barcode', `
    <div class="scan-camera-wrap">
      <div class="scan-camera-box" id="scanCameraTarget"></div>
      <div class="scan-camera-guide"></div>
    </div>
    <div class="hint" style="margin-top:8px;text-align:center;">Point the camera at the Code 128 barcode on the book's accession label.</div>
    <div class="hint" style="text-align:center;">No camera, or scanning not working? Cancel and type the accession number into the search box instead.</div>
  `, `
    <button type="button" class="btn" data-action="closeModal">Cancel</button>
  `, null);
}

function scanResultModal(itemNo){
  const item = findItem(itemNo);
  if(!item) return confirmModal({title:'Not found', message:'That copy could no longer be found.', onlyClose:true});
  const book = findBook(item.accessionNo);
  const loan = item.status==='Borrowed' ? state.circulation.find(c=>c.itemNo===itemNo && !c.returnDate) : null;
  const member = loan ? findMember(loan.memberId) : null;
  const badgeCls = item.status==='Available'?'ok':(item.status==='Borrowed'?'warn':'bad');
  return modalShell('Scanned copy', `
    <div class="panel" style="padding:12px 14px;">
      <div style="font-weight:600;">${esc(book?book.title:'(unknown title)')}</div>
      <div class="subnote" style="margin-bottom:10px;">${esc(book?book.author:'')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;">
        <div><span class="subnote">Accession No.</span><br><span class="mono">${esc(item.itemNo)}</span></div>
        <div><span class="subnote">Status</span><br><span class="badge ${badgeCls}"><span class="badge-dot"></span>${esc(item.status)}</span></div>
        <div><span class="subnote">Call No.</span><br><span class="mono">${esc(book?book.callNumber:'—')}</span></div>
        <div><span class="subnote">Copy</span><br>copy ${item.copyNumber}</div>
        ${member ? `<div><span class="subnote">Borrowed by</span><br>${esc(member.name)}</div><div><span class="subnote">Due date</span><br>${fmtDate(loan.dueDate)}</div>` : ''}
      </div>
    </div>
  `, `
    <button type="button" class="btn" data-action="closeModal">Close</button>
    ${item.status==='Available' ? `<button type="button" class="btn btn-brass" data-open-modal="issueBook" data-accession="${esc(item.accessionNo)}" data-item="${esc(item.itemNo)}">${icon('swap',14)} Issue this copy</button>` : ''}
    ${item.status==='Borrowed' && loan ? `<button type="button" class="btn btn-primary" data-open-modal="returnBook" data-txn="${esc(loan.transactionId)}">${icon('check',14)} Return this copy</button>` : ''}
  `, null);
}

function printLabelModal(itemNo){
  const item = findItem(itemNo);
  if(!item) return confirmModal({title:'Not found', message:'That copy could no longer be found.', onlyClose:true});
  const book = findBook(item.accessionNo);
  return modalShell('Book label', `
    <div class="print-label-content panel" style="padding:14px;text-align:center;">
      <div style="font-weight:600;font-size:13.5px;">${esc(book?book.title:'')}</div>
      <div class="subnote">${esc(book?book.author:'')}</div>
      <div class="subnote mono" style="margin-top:2px;">Call No. ${esc(book?book.callNumber:'—')}</div>
      <svg class="barcode-svg" data-code="${esc(item.itemNo)}"></svg>
    </div>
    <div class="hint no-print" style="margin-top:10px;">One physical book = one accession number = one barcode. This label identifies copy ${item.copyNumber} specifically.</div>
  `, `
    <button type="button" class="btn" data-action="closeModal">Close</button>
    <button type="button" class="btn btn-primary" data-action="printLabel">${icon('grid2',14)} Print label</button>
  `, null);
}

function backupModal(){
  return modalShell('Backup &amp; restore', `
    <div class="subnote" style="margin-bottom:14px;">Keep a copy of your data, or bring in records from another backup file.</div>
    <div class="btn-row" style="flex-direction:column;align-items:stretch;">
      <button type="button" class="btn btn-primary" style="justify-content:flex-start;" data-action="exportData">
        ${icon('download',15)}&nbsp; Export data (download a backup file)
      </button>
      <button type="button" class="btn" style="justify-content:flex-start;margin-top:8px;" data-action="importData">
        ${icon('upload',15)}&nbsp; Import data (restore from a backup file)

      <input type="file" id="importFileInput" accept="application/json" style="display:none;">

  `, `
    <button type="button" class="btn" data-action="closeModal">Close</button>
  `, null);

function withdrawBookModal(accession){
  const book = findBook(accession);
  if(!book) return confirmModal({title:'Not found', message:'That book could no longer be found.', onlyClose:true});
  return modalShell('Withdraw', `
    <div class="subnote" style="margin-bottom:12px;">${esc(book.title)} <span class="mono">(${esc(accession)})</span></div>
    <div class="btn-row" style="flex-direction:column;align-items:stretch;">
      <button type="button" class="btn" style="justify-content:flex-start;" data-action="chooseWithdrawCopy" data-accession="${esc(accession)}">
        ${icon('trash',15)}&nbsp; Withdraw one copy — lost, damaged, or pulled from the shelf
      </button>
      <button type="button" class="btn btn-danger" style="justify-content:flex-start;margin-top:8px;" data-action="chooseWithdrawTitle" data-accession="${esc(accession)}">

// Every physical copy of a title, each with its own permanent, library-wide
// accession number — independent of the title and of every other copy,
// same as a paper accession register or a Koha item record.
function viewItemsModal(accession){
  const book = findBook(accession);
  if(!book) return confirmModal({title:'Not found', message:'That book could no longer be found.', onlyClose:true});
  const items = itemsFor(accession).slice().sort((a,b)=>a.copyNumber-b.copyNumber);
  const withdrawn = book.status==='Withdrawn';
  return modalShell('Title record', `
    <div class="subnote" style="margin-bottom:2px;">${esc(book.title)}${withdrawn?' <span class="badge bad">Withdrawn</span>':''}</div>
    <div class="subnote" style="margin-bottom:12px;">by ${esc(book.author)} — call number <span class="mono">${esc(book.callNumber||'—')}</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Accession No.</th><th>Copy</th><th>Status</th><th>With</th><th></th></tr></thead>
      <tbody>
        ${items.length ? items.map(it=>{
          const badgeCls = it.status==='Available'?'ok':(it.status==='Borrowed'?'warn':'bad');
          const loan = it.status==='Borrowed' ? state.circulation.find(c=>c.itemNo===it.itemNo && !c.returnDate) : null;
          const member = loan ? findMember(loan.memberId) : null;
          return `<tr>
            <td class="cell-mono">${esc(it.itemNo)}</td>
            <td>copy ${it.copyNumber}</td>
            <td><span class="badge ${badgeCls}"><span class="badge-dot"></span>${esc(it.status)}</span></td>
            <td>${member ? esc(member.name) : '—'}</td>
            <td><button class="icon-btn" title="Print barcode label" data-open-modal="printLabel" data-item="${esc(it.itemNo)}">${icon('barcode',15)}</button></td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="5">No items recorded for this title.</td></tr>`}
      </tbody>
    </table></div>
    <div class="hint" style="margin-top:10px;">Each accession number is permanent and unique to that one physical copy, for the life of the item.</div>
  `, `
    <button type="button" class="btn" data-action="closeModal">Close</button>
    ${withdrawn
      ? `<button type="button" class="btn btn-primary" data-action="reactivateTitle" data-accession="${esc(accession)}">Reactivate title</button>`
      : `<button type="button" class="btn" data-action="chooseWithdrawCopy" data-accession="${esc(accession)}">Withdraw a copy</button>
         <button type="button" class="btn btn-danger" data-action="chooseWithdrawTitle" data-accession="${esc(accession)}">Withdraw title</button>
         <button type="button" class="btn btn-primary" data-open-modal="addBook" data-accession="${esc(accession)}">${icon('plus',13)} Add copy</button>`}
  `, null);
}

        </div>
        <div class="field-row">
          <div class="field"><label>Subject</label><input name="subject" value=""></div>
          <div class="field"><label>Department / Section</label><input name="department" value=""></div>
        </div>
        <div class="field-row">
          <div class="field"><label>DDC number</label><input name="ddc" value="" placeholder="e.g. 020" required></div>

// List fragments only — swapped in on every keystroke via .innerHTML, so
// the search input itself (and the rest of the modal) is never rebuilt.
// Lists individual AVAILABLE COPIES (not titles), so staff can search and
// pick the exact accession number they're handing out.
function issueBookListHtml(modal){
  const availItems = state.items.filter(i=>i.status==='Available');
  const bq = (modal.bookQuery||'').trim().toLowerCase();
  const matches = bq
    ? availItems.filter(i=>{
        const b = findBook(i.accessionNo);
        return [i.itemNo, b?b.title:'', b?b.author:'', b?b.subject:'', b?b.callNumber:''].join(' ').toLowerCase().includes(bq);
      })
    : availItems;
  return matches.length ? matches.map(i=>{
    const b = findBook(i.accessionNo);
    return `<button type="button" class="picker-row ${modal.selectedItemNo===i.itemNo?'selected':''}" data-pick="book" data-accession="${esc(i.accessionNo)}" data-item="${esc(i.itemNo)}">
      <div class="picker-main">${esc(b?b.title:i.accessionNo)} <span class="mono subnote">${esc(i.itemNo)}</span></div>
      <div class="picker-sub">${esc(b?b.author:'')} ${b&&b.callNumber?('· '+esc(b.callNumber)):''}</div>
    </button>`;
  }).join('') : `<div class="picker-empty">${availItems.length ? 'No copies match your search.' : 'No copies are currently available to issue.'}</div>`;
}
function issueMemberListHtml(modal){
  const activeMembers = state.members.filter(m=>m.status==='Active');
  const mq = (modal.memberQuery||'').trim().toLowerCase();
  const memberMatches = mq
    ? activeMembers.filter(m=>[m.name,m.memberId,m.phone].join(' ').toLowerCase().includes(mq))
    : activeMembers;
  return memberMatches.length ? memberMatches.map(m=>{
    const count = activeLoanCountFor(m.memberId);
    const atLimit = count>=MAX_BORROW_LIMIT;
    return `
    <button type="button" class="picker-row ${modal.selectedMemberId===m.memberId?'selected':''}" data-pick="member" data-value="${esc(m.memberId)}" data-display="${esc(m.name)}" ${atLimit?'disabled':''}>
      <div class="picker-main">${esc(m.name)}</div>
      <div class="picker-sub">${esc(m.memberId)} · ${esc(m.category)} · <span class="${atLimit?'mono':'mono'}" style="${atLimit?'color:var(--bad);font-weight:600;':''}">${count}/${MAX_BORROW_LIMIT} borrowed${atLimit?' — at limit':''}</span></div>
    </button>`;
  }).join('') : `<div class="picker-empty">${activeMembers.length ? 'No members match your search.' : 'No active members are registered.'}</div>`;
}
// The per-member "borrowing dashboard" shown once a member is selected for
// checkout — their current loans, so staff can see at a glance what they
// already have out and confirm there's room under the 2-book limit.
// The per-member "borrowing dashboard" shown once a member is selected for
// checkout — their current loans, so staff can see at a glance what they
// already have out and confirm there's room under the 2-book limit.
// Stacked rows (not a wide table) so this stays readable on a phone-width
// modal instead of overflowing or squeezing columns unreadably.
function memberBorrowDashboardHtml(memberId){
  if(!memberId) return '';
  const member = findMember(memberId);
  if(!member) return '';
  const loans = state.circulation.filter(c=>c.memberId===memberId && !c.returnDate);
  const count = loans.length;
  return `
    <div class="panel" style="padding:10px 12px;margin-top:8px;">
      <div style="font-weight:600;">${esc(member.name)} — <span class="mono">${esc(member.memberId)}</span></div>
      <div class="subnote" style="margin-bottom:${loans.length?'8px':'0'};">Currently borrowed: ${count} / ${MAX_BORROW_LIMIT}</div>
      ${loans.map(c=>{
        const book = findBook(c.accessionNo);
        const status = txnStatus(c);
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);">
          <div style="min-width:0;">
            <div style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(book?book.title:c.accessionNo)}</div>
            <div class="subnote mono">${esc(c.itemNo||'—')} · due ${fmtDate(c.dueDate)}</div>
          </div>
          <span class="badge ${status==='Overdue'?'bad':'ok'}" style="flex-shrink:0;"><span class="badge-dot"></span>${status}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

    </button>`).join('') : `<div class="picker-empty">No active members are registered.</div>`;
}
