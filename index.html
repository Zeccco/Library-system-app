/* ======================= form submit -> confirm bridge ======================= */
function formToObj(containerId){
  const container = document.getElementById(containerId);
  const o = {};
  if(!container) return o;
  container.querySelectorAll('[name]').forEach(el=>{ o[el.name] = el.value; });
  return o;
}
// Returns true (and shows a toast + focuses the field) if a required field in the
// given container is empty — used since we no longer rely on native form validation.
function missingRequired(containerId, names){
  const container = document.getElementById(containerId);
  if(!container) return true;
  for(const n of names){
    const el = container.querySelector(`[name="${n}"]`);
    if(el && !String(el.value||'').trim()){
      el.focus();
      showToast('Please fill in all required fields.');
      return true;
    }
  }
  return false;
}

async function handleSubmitAddCopy(){
  const preselected = state.modal.selectedAccession && findBook(state.modal.selectedAccession);
  const requiredFields = preselected ? ['acquiredDate'] : ['title','author','ddc','acquiredDate'];
  if(missingRequired('addCopyForm', requiredFields)) return;
  const o = formToObj('addCopyForm');
  const copyFields = {
    itemNoOverride: (o.itemAccessionNo||'').trim(),
    shelfLocation: (o.shelfLocation||'').trim(),
    status: o.itemStatus || 'Available',
    acquiredDate: o.acquiredDate || todayISO()
  };
  let result;
  if(preselected){
    result = await dbAddCopy({accessionNo: preselected.accessionNo, ...copyFields});
  } else {
    const accessionNo = nextId('A', state.books, 'accessionNo');
    const book = {
      accessionNo, title:o.title.trim(), author:o.author.trim(), isbn:(o.isbn||'').trim(),
      subject:(o.subject||'').trim(), ddc:o.ddc.trim(), year:o.year?parseInt(o.year,10):'',
      callNumber:(o.callNumber||'').trim() || suggestCallNumber(o.ddc.trim(), o.author.trim()),
      edition:(o.edition||'').trim(), publisher:(o.publisher||'').trim(), department:(o.department||'').trim()
    };
    result = await dbInsertNewTitle(book, copyFields);
  }
  if(result.error){ showToast(result.error.message || 'Could not save to Supabase.'); return; }
  closeModal(); showToast(`Copy added — accession number ${result.itemNo}.`);
}

async function handleIssueSubmit(){
  if(missingRequired('issueForm', ['accessionNo','memberId','issueDate','dueDate'])) return;
  const o = formToObj('issueForm');
  const book = findBook(o.accessionNo);
  // selectedItemNo is the one source of truth for which exact physical copy
  // gets issued — set the moment a copy is picked from the search list,
  // pre-chosen from a specific Catalog row, or resolved by a barcode scan.
  const chosenItemNo = (state.modal && state.modal.selectedItemNo) || '';
  let item = null;
  if(chosenItemNo){
    const chosen = findItem(chosenItemNo);
    if(!chosen || chosen.status!=='Available'){
      showToast(chosen ? `This copy (${chosenItemNo}) is currently ${chosen.status} and cannot be checked out.` : `Accession number ${chosenItemNo} could no longer be found.`);
      return;
    }
    item = chosen;
  } else if(book){
    // No specific copy chosen yet (shouldn't normally happen once a book is
    // picked from the list, since that always sets selectedItemNo too) —
    // fall back to the lowest-numbered available copy of that title rather
    // than blocking the checkout outright.
    item = nextAvailableItem(o.accessionNo);
  }
  if(!book){ showToast('Please select a book to issue.'); return; }
  if(!item){ showToast('No available copy of this title was found — it may have just been issued to someone else. Try searching again.'); return; }
  const member = findMember(o.memberId);
  if(!member || member.status!=='Active'){ showToast('Select an active member.'); return; }
  if(activeLoanCountFor(member.memberId)>=MAX_BORROW_LIMIT){
    showToast(`Borrowing limit reached. This member can borrow a maximum of ${MAX_BORROW_LIMIT} books.`);
    return;
  }
  const txn = {
    transactionId: nextId('T', state.circulation, 'transactionId'),
    accessionNo:o.accessionNo, memberId:o.memberId, issueDate:o.issueDate, dueDate:o.dueDate,
    returnDate:null, finePerDay:state.settings.finePerDay, finePaid:false, itemNo:item.itemNo
  };
  const err = await dbInsertCirculation(txn);
  if(err){ showToast('Could not save to Supabase: '+err.message); return; }
  state.circulation.push(txn);
  closeModal(); showToast(`Issued item ${item.itemNo} to ${member.name}. Due ${fmtDate(o.dueDate)}.`);
}

function handleReturnSubmit(txnId){
  if(missingRequired('returnForm', ['returnDate'])) return;
  const o = formToObj('returnForm');
  const c = state.circulation.find(x=>x.transactionId===txnId);
  if(!c){ showToast('Transaction no longer exists.'); return; }
  const late = Math.max(0, daysBetween(c.dueDate, o.returnDate));
  const fine = late * (c.finePerDay || state.settings.finePerDay);
  const conditionNote = o.condition && o.condition!=='Good' ? ` This copy will also be withdrawn from circulation as <strong>${esc(o.condition)}</strong>.` : '';
  const msg = (late>0
    ? `Mark this as returned on ${fmtDate(o.returnDate)}? A fine of <strong>MK ${fine.toLocaleString()}</strong> (${late} day(s) late) will be recorded.`
    : `Mark this as returned on ${fmtDate(o.returnDate)}? No fine applies.`) + conditionNote;
  state.modal = {type:'confirm', title:'Confirm return', message:msg, confirmLabel:'Confirm return', neutral:true,
    onConfirm:{kind:'applyReturn', txnId, returnDate:o.returnDate, condition:o.condition}};
  render();
}

/* ======================= delete / withdraw / mark-paid confirms ======================= */
function confirmReactivateTitle(accession){
  state.modal = {type:'confirm', title:'Reactivate this title?', message:'This makes the title issuable again and shows it in the catalog by default.',
    confirmLabel:'Reactivate', neutral:true, onConfirm:{kind:'reactivateTitle', accession}};
  render();
}
function confirmWithdrawTitle(accession){
  const activeLoans = borrowedCountFor(accession);
  if(activeLoans>0){
    state.modal = {type:'confirm', title:'Cannot withdraw', message:`This title has ${activeLoans} active loan(s). Return them first before withdrawing the whole title.`, onlyClose:true};
    render(); return;
  }
  state.modal = {type:'confirm', title:'Withdraw this entire title?', message:'The record stays in your history — it just stops appearing as issuable and is hidden from the catalog by default. You can reactivate it any time.', confirmLabel:'Withdraw title',
    onConfirm:{kind:'withdrawTitle', accession}};
  render();
}
function confirmWithdrawCopy(accession){
  const book = findBook(accession);
  if(!book || availableCopies(book)<1){
    state.modal = {type:'confirm', title:'Cannot withdraw a copy', message:'There is no copy currently sitting on the shelf for this title — every active copy is out on loan. Return one first, or withdraw the whole title once all copies are back.', onlyClose:true};
    render(); return;
  }
  state.modal = {type:'confirm', title:'Withdraw one copy?', message:'This permanently removes one physical copy from circulation (lost, damaged, or otherwise pulled) — the title and its loan history stay exactly as they are.', confirmLabel:'Withdraw copy',
    onConfirm:{kind:'withdrawCopy', accession}};
  render();
}
function confirmDeleteMember(memberId){
  const activeLoans = state.circulation.filter(c=>c.memberId===memberId && !c.returnDate).length;
  if(activeLoans>0){
    state.modal = {type:'confirm', title:'Cannot delete', message:`This member has ${activeLoans} active loan(s). Return their book(s) first before deleting the record.`, onlyClose:true};
    render(); return;
  }
  state.modal = {type:'confirm', title:'Delete member record?', message:'This permanently removes the member and cannot be undone.', confirmLabel:'Delete',
    onConfirm:{kind:'deleteMember', memberId}};
  render();
}
function confirmDeleteCirc(txnId){
  state.modal = {type:'confirm', title:'Delete transaction record?', message:'This permanently removes the circulation and fine history for this transaction.', confirmLabel:'Delete',
    onConfirm:{kind:'deleteCirc', txnId}};
  render();
}
function confirmMarkPaid(txnId, paid){
  state.modal = {type:'confirm', title: paid ? 'Mark fine as paid?' : 'Mark fine as unpaid?',
    message: paid ? 'This records the outstanding fine as collected.' : 'This will move the fine back to outstanding.',
    confirmLabel: paid?'Mark paid':'Mark unpaid', neutral:true,
    onConfirm:{kind:'setPaid', txnId, paid}};
  render();
}
function confirmRenew(txnId){
  const c = state.circulation.find(x=>x.transactionId===txnId);
  if(!c) return;
  if(c.renewalCount>=MAX_RENEWALS){
    state.modal = {type:'confirm', title:'Cannot renew', message:`This loan has already been renewed ${MAX_RENEWALS} time(s), the maximum allowed. Please return and reissue if the member still needs it.`, onlyClose:true};
    render(); return;
  }
  const waiting = holdsWaitingCount(c.accessionNo);
  const newDue = addDays(c.dueDate, state.settings.loanPeriodDays);
  const book = findBook(c.accessionNo);
  const warn = waiting ? `<br><br><strong>Heads up:</strong> ${waiting} member(s) are waiting on hold for this title.` : '';
  state.modal = {type:'confirm', title:'Renew this loan?', message:`New due date will be <strong>${fmtDate(newDue)}</strong> (renewal ${c.renewalCount+1} of ${MAX_RENEWALS}) for <strong>${esc(book?book.title:c.accessionNo)}</strong>.${warn}`,
    confirmLabel:'Renew', neutral:true, onConfirm:{kind:'renew', txnId, newDue}};
  render();
}
function confirmCancelHold(holdId){
  state.modal = {type:'confirm', title:'Cancel this hold?', message:'The hold record stays in your history marked as cancelled — nothing is deleted.', confirmLabel:'Cancel hold',
    onConfirm:{kind:'cancelHold', holdId}};
  render();
}
function confirmFulfillHold(holdId){
  state.modal = {type:'confirm', title:'Mark this hold fulfilled?', message:'Use this once the member has been issued the copy they were waiting for.', confirmLabel:'Mark fulfilled', neutral:true,
    onConfirm:{kind:'fulfillHold', holdId}};

}
async function handlePlaceHold(){
  if(missingRequired('placeHoldForm', ['accessionNo','memberId'])) return;
  const o = formToObj('placeHoldForm');
  const hold = {holdId: nextId('H', state.holds, 'holdId'), accessionNo:o.accessionNo, memberId:o.memberId, requestedDate:todayISO()};
  const err = await dbInsertHold(hold);
  if(err){ showToast('Could not save to Supabase: '+err.message); return; }
  state.holds.push(hold);
  closeModal(); showToast('Hold placed.');
}

async function runConfirm(){
  const c = state.modal && state.modal.onConfirm;
  if(!c){ closeModal(); return; }
  let err = null, successMsg = '';
  if(c.kind==='withdrawTitle'){
    err = await dbSetBookStatus(c.accession, 'Withdrawn');
    if(!err) successMsg='Title withdrawn — it stays in your records but can no longer be issued.';
  } else if(c.kind==='reactivateTitle'){
    err = await dbSetBookStatus(c.accession, 'Active');
    if(!err) successMsg='Title reactivated.';
  } else if(c.kind==='withdrawCopy'){
    const result = await dbWithdrawCopy(c.accession);
    err = result.error;
    if(!err) successMsg = `Item ${result.itemNo} withdrawn from circulation.`;
  } else if(c.kind==='deleteMember'){
    err = await dbDeleteMember(c.memberId);
    if(!err){ state.members = state.members.filter(m=>m.memberId!==c.memberId); successMsg='Member deleted.'; }
  } else if(c.kind==='deleteCirc'){
    err = await dbDeleteCirc(c.txnId);
    if(!err){ state.circulation = state.circulation.filter(x=>x.transactionId!==c.txnId); successMsg='Transaction deleted.'; }
  } else if(c.kind==='applyEditBook'){
    err = await dbUpdateBook(c.accession, c.data);
    if(!err) successMsg='Book record updated.';
  } else if(c.kind==='applyEditMember'){
    err = await dbUpdateMember(c.memberId, c.data);
    if(!err) successMsg='Member record updated.';
  } else if(c.kind==='applyReturn'){
    err = await dbApplyReturn(c.txnId, c.returnDate, c.condition);
    if(!err) successMsg = c.condition && c.condition!=='Good' ? `Return recorded — copy marked ${c.condition.toLowerCase()} and withdrawn.` : 'Return recorded.';
  } else if(c.kind==='renew'){
    err = await dbRenewLoan(c.txnId, c.newDue);
    if(!err) successMsg = 'Loan renewed to '+fmtDate(c.newDue)+'.';
  } else if(c.kind==='setPaid'){
    err = await dbSetFinePaid(c.txnId, c.paid);
    if(!err) successMsg = c.paid?'Fine marked paid.':'Fine marked unpaid.';
  } else if(c.kind==='cancelHold'){
    err = await dbSetHoldStatus(c.holdId, 'Cancelled');
    if(!err) successMsg='Hold cancelled.';
  } else if(c.kind==='fulfillHold'){
    err = await dbSetHoldStatus(c.holdId, 'Fulfilled');
    if(!err) successMsg='Hold marked fulfilled.';
  }
  if(err){ showToast('Supabase error: '+(err.message||'could not save changes.')); return; }
  closeModal();
  showToast(successMsg);
}

/* ======================= event delegation ======================= */
function attachHandlers(){
  const app = document.getElementById('app');
  syncTopbarHeight();

  app.onclick = (e)=>{
    const navBtn = e.target.closest('[data-nav]');
    if(navBtn){
      state.route = navBtn.dataset.nav;
      // Stat cards (and similar shortcuts) can carry a filter to apply on
      // arrival, e.g. jumping straight to "Overdue" within Circulation
      // instead of just the unfiltered page.
      if(navBtn.dataset.filterKey) state[navBtn.dataset.filterKey] = navBtn.dataset.filterValue;
      render();
      return;
    }

    const openBtn = e.target.closest('[data-open-modal]');
    if(openBtn){
      const type = openBtn.dataset.openModal;
      if(openBtn.disabled) return;
      if(type==='editBook') state.modal = {type, accession:openBtn.dataset.accession};
      else if(type==='addBook') state.modal = {type, titleQuery:'', selectedAccession:openBtn.dataset.accession||'', newTitleMode:false};
      else if(type==='editMember') state.modal = {type, member:openBtn.dataset.member};
      else if(type==='issueBook'){
        const acc = openBtn.dataset.accession||'';
        const forcedItem = openBtn.dataset.item||'';
        const b = acc ? findBook(acc) : null;
        // selectedItemNo is the single source of truth for "which exact copy
        // gets issued" — whether it came from clicking Issue on one specific
        // catalog copy (forcedItem here) or from picking one in this modal's
        // own search list. lockToItem just controls whether that search box
        // shows at all (hidden when a specific copy was pre-chosen).
        state.modal = {
          type, selectedAccession:acc, selectedItemNo:forcedItem, lockToItem:!!forcedItem,
          bookQuery: b?b.title:'', selectedMemberId:'', memberQuery:''
        };
      }
      else if(type==='returnBook') state.modal = {type, txn:openBtn.dataset.txn};
      else if(type==='returnBookPicker') state.modal = {type, query:'', selectedTxn:''};
      else if(type==='withdrawBook') state.modal = {type, accession:openBtn.dataset.accession};
      else if(type==='viewItems') state.modal = {type, accession:openBtn.dataset.accession};
      else if(type==='printLabel') state.modal = {type, itemNo:openBtn.dataset.item};
      else if(type==='placeHold'){
        const acc = openBtn.dataset.accession||'';
        const b = acc ? findBook(acc) : null;
        state.modal = {type, selectedAccession:acc, bookQuery: b?b.title:'', selectedMemberId:'', memberQuery:''};
      }
      else state.modal = {type};
      render(); return;
    }

    const pickBtn = e.target.closest('[data-pick]');
    if(pickBtn && state.modal){
      const kind = pickBtn.dataset.pick;
      const value = pickBtn.dataset.value;
      const display = pickBtn.dataset.display || '';
      if(kind==='book'){
        const accession = pickBtn.dataset.accession || value;
        const itemNo = pickBtn.dataset.item || '';
        state.modal.selectedAccession = accession;
        state.modal.selectedItemNo = itemNo;
        // Deliberately leave bookQuery as whatever the user searched —
        // don't overwrite it with the picked item's own label. Doing that
        // used to make the list immediately re-filter against text that
        // matches nothing (the display label, not real book data), showing
        // a confusing "No copies match" right under a valid selection.
      }
      else if(kind==='member'){ state.modal.selectedMemberId = value; state.modal.memberQuery = display; }
      else if(kind==='return'){ state.modal.selectedTxn = value; }
      else if(kind==='holdBook'){ state.modal.selectedAccession = value; state.modal.bookQuery = display; }
      else if(kind==='holdMember'){ state.modal.selectedMemberId = value; state.modal.memberQuery = display; }
      else if(kind==='addCopyTitle'){ state.modal.selectedAccession = value; }
      render(); return;
    }

    const chipBtn = e.target.closest('[data-chip]');
    if(chipBtn){ state[chipBtn.dataset.chip] = chipBtn.dataset.value; render(); return; }

    const actionBtn = e.target.closest('[data-action]');
    if(actionBtn){
      const a = actionBtn.dataset.action;
      if(a==='closeModal'){ closeModal(); return; }
      if(a==='runConfirm'){ setButtonBusy(actionBtn,'Saving…'); runConfirm(); return; }
      if(a==='deleteMember'){ confirmDeleteMember(actionBtn.dataset.member); return; }
      if(a==='deleteCirc'){ confirmDeleteCirc(actionBtn.dataset.txn); return; }
      if(a==='markPaid'){ confirmMarkPaid(actionBtn.dataset.txn, true); return; }
      if(a==='unmarkPaid'){ confirmMarkPaid(actionBtn.dataset.txn, false); return; }
      if(a==='renewLoan'){ confirmRenew(actionBtn.dataset.txn); return; }
      if(a==='reactivateTitle'){ confirmReactivateTitle(actionBtn.dataset.accession); return; }
      if(a==='chooseWithdrawCopy'){ confirmWithdrawCopy(actionBtn.dataset.accession); return; }
      if(a==='chooseWithdrawTitle'){ confirmWithdrawTitle(actionBtn.dataset.accession); return; }
      if(a==='cancelHold'){ confirmCancelHold(actionBtn.dataset.hold); return; }
      if(a==='fulfillHold'){ confirmFulfillHold(actionBtn.dataset.hold); return; }
      if(a==='submitPlaceHold'){ setButtonBusy(actionBtn,'Saving…'); handlePlaceHold(); return; }
      if(a==='pickReturn'){
        const sel = document.getElementById('returnPickerSelect');
        if(sel && sel.value){ state.modal = {type:'returnBook', txn:sel.value}; render(); }
        else showToast('Choose a transaction first.');
        return;
      }
      if(a==='submitAddCopy'){ setButtonBusy(actionBtn,'Saving…'); handleSubmitAddCopy(); return; }
      if(a==='addCopyNewTitle'){ state.modal.newTitleMode = true; render(); return; }
      if(a==='addCopyBackToSearch'){ state.modal.newTitleMode = false; state.modal.selectedAccession = ''; render(); return; }
      if(a==='submitEditBook'){ handleEditBookSubmit(actionBtn.dataset.accession); return; }
      if(a==='submitAddMember'){ setButtonBusy(actionBtn,'Saving…'); handleAddMember(); return; }
      if(a==='submitEditMember'){ handleEditMemberSubmit(actionBtn.dataset.member); return; }
      if(a==='submitIssue'){ if(actionBtn.disabled) return; setButtonBusy(actionBtn,'Issuing…'); handleIssueSubmit(); return; }
      if(a==='submitReturn'){ handleReturnSubmit(actionBtn.dataset.txn); return; }
      if(a==='signOut'){ setButtonBusy(actionBtn,'Signing out…'); handleSignOut(); return; }
      if(a==='exportData'){ handleExportData(); return; }
      if(a==='importData'){ document.getElementById('importFileInput').click(); return; }
      if(a==='printShelfList'){ window.print(); return; }
      if(a==='openCameraScan'){ openCameraScan(actionBtn.dataset.context); return; }
      if(a==='unlockIssueItem'){
        state.modal.lockToItem = false;
        state.modal.selectedAccession = ''; state.modal.selectedItemNo = ''; state.modal.bookQuery = '';
        render(); return;
      }
      if(a==='printLabel'){ printCurrentLabel(); return; }
    }

    if(e.target.id==='overlay'){ closeModal(); return; }
  };

  // Search-box typing bypasses the full render() and swaps only the results
  // table / picker list back in — the topbar, sidebar, and every other
  // section on screen are left completely untouched, so there's no
  // page-wide flash and the input never loses focus.
  app.oninput = (e)=>{
    const inputKey = e.target.dataset.input;
    if(inputKey){
      state[inputKey] = e.target.value;
      if(inputKey==='catalogQuery') swapOuter('catalogTableWrap', catalogTableHtml());
      else if(inputKey==='memberQuery') swapOuter('memberTableWrap', memberTableHtml());
      else if(inputKey==='circQuery') swapOuter('circTableWrap', circTableHtml());
      else render();
      return;
    }
    const pickerKind = e.target.dataset.pickerSearch;
    if(pickerKind && state.modal){
      if(pickerKind==='book'){
        state.modal.bookQuery = e.target.value; state.modal.selectedAccession=''; state.modal.selectedItemNo='';
        swapInner('issueBookList', issueBookListHtml(state.modal));
      } else if(pickerKind==='member'){
        state.modal.memberQuery = e.target.value; state.modal.selectedMemberId='';
        swapInner('issueMemberList', issueMemberListHtml(state.modal));
        swapInner('memberBorrowDashboard', memberBorrowDashboardHtml(''));
      } else if(pickerKind==='return'){
        state.modal.query = e.target.value; state.modal.selectedTxn='';
        swapInner('returnPickerList', returnPickerListHtml(state.modal));
        const continueBtn = document.querySelector('.modal-foot [data-action="pickReturn"]');
        if(continueBtn) continueBtn.disabled = true;
      } else if(pickerKind==='holdBook'){
        state.modal.bookQuery = e.target.value; state.modal.selectedAccession='';
        swapInner('holdBookList', holdBookListHtml(state.modal));
      } else if(pickerKind==='holdMember'){
        state.modal.memberQuery = e.target.value; state.modal.selectedMemberId='';
        swapInner('holdMemberList', holdMemberListHtml(state.modal));
      } else if(pickerKind==='addCopyTitle'){
        state.modal.titleQuery = e.target.value;
        swapInner('addCopyTitleList', addCopyTitleListHtml(state.modal));
      }
    }
  };
  app.onchange = (e)=>{
    if(e.target.dataset.select){ state[e.target.dataset.select] = e.target.value; render(); return; }
    if(e.target.id==='importFileInput'){
      const file = e.target.files && e.target.files[0];
      if(file) handleImportFile(file);
      return;
    }
  };

  // Enter key inside a modal field triggers the modal's primary action button,
  // since there's no native <form> submission to rely on. Inside a search
  // picker, Enter instead picks the top matching result.
  app.onkeydown = (e)=>{
    if(e.key!=='Enter') return;
    const searchInput = e.target.closest('[data-picker-search]');
    if(searchInput){
      e.preventDefault();
      const field = searchInput.closest('.field');
      if(!field) return;
      // Prefer an exact accession-number match over "just the first result"
      // — this is what makes a scanner (or someone typing a full code fast)
      // reliably land on the *right* copy even if the list has several rows.
      const typed = searchInput.value.trim().toLowerCase();
      const rows = Array.from(field.querySelectorAll('.picker-row'));
      const exact = rows.find(r => (r.dataset.item||r.dataset.value||'').toLowerCase()===typed);
      const target = exact || rows[0];
      if(target) target.click();
      return;
    }
    const modalBody = e.target.closest('.modal-body');
    if(!modalBody || e.target.tagName==='SELECT') return;
    e.preventDefault();
    const modal = modalBody.closest('.modal');
    const primary = modal && modal.querySelector('.modal-foot button:not([data-action="closeModal"])');
    if(primary) primary.click();
  };
}

/* ======================= init ======================= */
window.addEventListener('resize', syncTopbarHeight);
initAuth();
</script>
</body>
</html>
